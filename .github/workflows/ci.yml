name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app backend/validate_phase3.py backend/validate_phase4.py backend/validate_phase5.py backend/validate_phase6.py backend/validate_phase7.py backend/validate_phase8.py backend/validate_phase8_origin.py backend/validate_phase9.py backend/validate_facebook_media_interaction.py
      - name: Import FastAPI application
        working-directory: backend
        run: python -c "from app.main import app; print(app.version)"
      - name: Initialize database schema
        working-directory: backend
        run: python -c "from app.database import init_db; init_db(); print('schema ok')"
      - name: Validate Phase 2 domain bootstrap
        working-directory: backend
        run: python -c "from app.database import init_db, SessionLocal; init_db(); from app.models.flow import Flow; from sqlalchemy import select; db=SessionLocal(); flow=db.scalar(select(Flow).where(Flow.platform == 'facebook')); assert flow and flow.current_revision_id; print('phase2 domain ok'); db.close()"
      - name: Validate Phase 3 formal execution bridge
        working-directory: backend
        run: python validate_phase3.py
      - name: Validate Phase 4 SQLite scheduler
        working-directory: backend
        run: python validate_phase4.py
      - name: Validate Phase 5 batch scheduling
        working-directory: backend
        run: python validate_phase5.py
      - name: Validate Phase 6 task timeline and review
        working-directory: backend
        run: python validate_phase6.py
      - name: Validate Phase 7 Facebook composition
        working-directory: backend
        run: python validate_phase7.py
      - name: Validate Phase 8 Instagram adapter
        working-directory: backend
        run: python validate_phase8.py
      - name: Validate Phase 8 Instagram origin safety
        working-directory: backend
        run: python validate_phase8_origin.py
      - name: Validate Phase 9 Facebook V1 release candidate
        working-directory: backend
        run: python validate_phase9.py
      - name: Validate Facebook media interaction guard
        working-directory: backend
        run: python validate_facebook_media_interaction.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
